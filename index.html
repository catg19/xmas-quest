<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEGO Zombie Xmas Defense 🎄🧱</title>
    <style>
        body {
            background-color: #fcfbf7;
            color: #1f3a29;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 90vh;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: #ffffff;
            border: 3px solid #2d5a3f;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            padding: 25px;
            box-sizing: border-box;
            margin-top: 10px;
        }

        h1 {
            color: #c8372d;
            text-align: center;
            font-size: 24px;
            margin-top: 0;
        }

        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #2d5a3f;
            margin-bottom: 20px;
            border-bottom: 2px dashed #e0dfd5;
            padding-bottom: 10px;
        }

        .game-screen {
            background: #f4f3ea;
            border: 2px solid #d0cfc3;
            border-radius: 8px;
            padding: 20px;
            min-height: 180px;
            margin-bottom: 20px;
            font-size: 15px;
            line-height: 1.5;
        }

        .action-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            border: 2px solid #2d5a3f;
            border-radius: 6px;
            outline: none;
            background: #fff;
            color: #1f3a29;
        }

        button {
            background-color: #c8372d;
            color: white;
            border: none;
            padding: 12px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #a02b22;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }

        .btn-choice {
            background-color: #2d5a3f;
        }
        .btn-choice:hover {
            background-color: #1f3a29;
        }

        .error { color: #c8372d; font-weight: bold; margin-top: 10px; }
        .success { color: #2d5a3f; font-weight: bold; margin-top: 10px; }
        
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🧟‍♂️ 🧱 LEGO Zombie Xmas Defense 🎅</h1>
        <div class="subtitle">Sistem de supraviețuire tactică & misiune secretă de iarnă</div>

        <div class="game-screen" id="gameScreen">
            <!-- Dinamic prin JS -->
        </div>

        <div id="inputSection" class="action-box">
            <input type="text" id="userInput" placeholder="Introdu comanda sau răspunsul..." autofocus autocomplete="off">
            <button id="submitBtn" onclick="handleAction()">Trimite</button>
        </div>
        
        <div id="choiceSection" class="hidden btn-group">
            <!-- Butoane opționale pentru alegeri -->
        </div>
    </div>

<script>
    const screen = document.getElementById("gameScreen");
    const input = document.getElementById("userInput");
    const inputSection = document.getElementById("inputSection");
    const choiceSection = document.getElementById("choiceSection");

    let level = 1;

    function renderScreen() {
        if (level === 1) {
            screen.innerHTML = `
                <b>Nivel 1: Apărarea Perimetrului (Zombii & LEGO)</b><br><br>
                🎄 O hoardă de zombii se apropie amenințător de baza ta de Crăciun! Baza este construită din piese LEGO, dar perimetrul este descoperit.<br><br>
                💡 <b>Misiune:</b> Trebuie să asamblezi rapid un zid de apărare din cărămizi LEGO.<br>
                👉 <i>Indiciu: Scrie comanda</i> <code>build lego-wall</code> <i>ca să ridici zidul!</i>
            `;
        } else if (level === 2) {
            screen.innerHTML = `
                <b>Nivel 2: Amintirea de pe Kiseleff</b><br><br>
                🧱 Zidul LEGO a oprit hoarda principală, dar un zombi masiv încearcă să spargă poarta principală!<br><br>
                🕵️‍♂️ Sistemul de securitate îți cere o parolă bazată pe o amintire: În seara aia de pe Kiseleff când v-ați contrazis... ce zicea el că are domnul de pe stradă în mână?<br><br>
                👇 Alege varianta corectă sau tastează răspunsul:
            `;
            inputSection.style.display = "none";
            choiceSection.style.display = "flex";
            choiceSection.innerHTML = `
                <button class="btn-choice" onclick="checkChoice('coasa')">Coasa (El)</button>
                <button class="btn-choice" onclick="checkChoice('matura')">Mătură lungă (Tu)</button>
            `;
        } else if (level === 3) {
            choiceSection.style.display = "none";
            inputSection.style.display = "flex";
            screen.innerHTML = `
                <b>Nivel 3: Codul Suprem de Suprascriere</b><br><br>
                🎉 Ai trecut de poartă! Ești la ultimul pas.<br><br>
                ⚡ Unitatea centrală a bazei necesită codul secret al proiectului (denumirea secretă pe care ai pus-o cadoului hardware care te așteaptă).<br><br>
                💡 <i>Indiciu: Cum se numește proiectul secret? (Începe cu litera 'z'...)</i>
            `;
            input.value = "";
            input.placeholder = "Introdu codul secret...";
        } else if (level === 4) {
            inputSection.style.display = "none";
            choiceSection.style.display = "none";
            screen.innerHTML = `
                <div style="text-align: center; color: #c8372d;">
                    <h2>🎁 🌟 BAZA LEGO SALVATĂ CU SUCCES! 🌟 🎁</h2>
                </div>
                ❤️ <b>Felicitări, supraviețuitorule! Ai spart toate codurile și ai trecut de apocalipsă!</b><br><br>
                ⚡ Toate sistemele sunt securizate. Premiul tău hardware (Raspberry Pi 5) este ținut sub strictă pază de iubita ta!<br><br>
                <b>Protocolul final de revendicare a cadoului:</b><br>
                1. Du-te la ea și activează codul vostru secret de „I love you”: <b>apasă de 3 ori în orice loc</b> 👆✨<br>
                2. Primești un pupic cald de la ea ca recompensă finală! 😘
            `;
        }
    }

    function handleAction() {
        const val = input.value.trim().toLowerCase();
        
        if (level === 1) {
            if (val === "build lego-wall") {
                level = 2;
                renderScreen();
            } else {
                screen.innerHTML += `<div class="error">❌ Comandă greșită! Încearcă: <code>build lego-wall</code></div>`;
            }
        } else if (level === 3) {
            if (val === "zmeurica") {
                level = 4;
                renderScreen();
            } else {
                screen.innerHTML += `<div class="error">❌ Cod incorect! Gândește-te la numele de cod al proiectului.</div>`;
            }
        }
        input.value = "";
    }

    function checkChoice(choice) {
        if (choice === "coasa") {
            level = 3;
            renderScreen();
        } else {
            screen.innerHTML += `<div class="error"><br>❌ Nu, aia era varianta ta (mătura)! El a zis coasa. Mai încearcă!</div>`;
        }
    }

    input.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            handleAction();
        }
    });

    // Inițializare
    renderScreen();
</script>

</body>
</html>
