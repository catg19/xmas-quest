<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xmas Zombie Apocalypse Quest 🎄🧟‍♂️</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 95vh;
            user-select: none;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: #1e293b;
            border: 3px solid #38bdf8;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        h1 { color: #f43f5e; margin-top: 0; font-size: 22px; }
        .hud { font-size: 14px; color: #38bdf8; margin-bottom: 12px; font-weight: bold; }

        .game-screen {
            background: #090d16;
            border: 2px dashed #475569;
            border-radius: 10px;
            padding: 15px;
            min-height: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .btn {
            background-color: #10b981;
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            font-family: 'Courier New', Courier, monospace;
        }
        .btn:hover { background-color: #059669; color: white; }

        /* Nivel 1: Perete stilizat LEGO 3D */
        .lego-wall-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            background: #1e293b;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #475569;
            margin-bottom: 12px;
        }
        .lego-wall-tile {
            height: 45px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            color: white;
            box-shadow: inset 0 3px 4px rgba(255,255,255,0.3), 0 3px 5px rgba(0,0,0,0.4);
            border-bottom: 4px solid rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        .lego-wall-tile:hover { transform: scale(1.03); }
        .t-red { background-color: #dc2626; }
        .t-yellow { background-color: #eab308; color: #1e293b; }
        .t-blue { background-color: #2563eb; }
        .t-green { background-color: #16a34a; }

        canvas { background: #111827; border: 2px solid #374151; border-radius: 6px; display: block; margin: 0 auto; }
        
        .puzzle-grid { display: grid; grid-template-columns: repeat(3, 80px); grid-template-rows: repeat(3, 80px); gap: 3px; background: #334155; padding: 3px; border-radius: 6px; }
        .puzzle-tile { background: #2563eb; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: white; cursor: pointer; user-select: none; }
        .puzzle-tile.empty { background: #0f172a; cursor: default; }

        .msg { margin-top: 10px; font-weight: bold; font-size: 12px; }
        .error { color: #f43f5e; }
        .success { color: #34d399; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🧟‍♂️ Xmas Zombie Quest 🎄🧱</h1>
        <div class="hud" id="hudTitle">Nivelul 1: Construirea Peretelui LEGO</div>
        <div class="game-screen" id="screen"></div>
    </div>

<script>
    const screen = document.getElementById("screen");
    const hud = document.getElementById("hudTitle");
    let currentLevel = 1;

    // ==========================================
    // NIVELUL 1: Perete LEGO (Pattern 3D)
    // ==========================================
    let wallProgress = 0;
    const targetWall = 9;
    function loadLevel1() {
        wallProgress = 0;
        hud.innerText = "Nivelul 1: Asamblarea Peretelui LEGO 🧱";
        screen.innerHTML = `
            <p style="font-size:12px; margin:0 0 10px 0;">Construiește peretele de piese LEGO (exact ca un panou arhitectural complet): apasă pe piesele de mai jos ca să le fixezi în structură (9 piese necesare):</p>
            <div class="lego-wall-grid" id="wallGrid">
                <div class="lego-wall-tile t-red" onclick="placeWallTile(this)">Piesă Roșie</div>
                <div class="lego-wall-tile t-yellow" onclick="placeWallTile(this)">Piesă Galbenă</div>
                <div class="lego-wall-tile t-blue" onclick="placeWallTile(this)">Piesă Albastră</div>
                <div class="lego-wall-tile t-green" onclick="placeWallTile(this)">Piesă Verde</div>
                <div class="lego-wall-tile t-red" onclick="placeWallTile(this)">Piesă Roșie</div>
                <div class="lego-wall-tile t-yellow" onclick="placeWallTile(this)">Piesă Galbenă</div>
                <div class="lego-wall-tile t-blue" onclick="placeWallTile(this)">Piesă Albastră</div>
                <div class="lego-wall-tile t-green" onclick="placeWallTile(this)">Piesă Verde</div>
                <div class="lego-wall-tile t-red" onclick="placeWallTile(this)">Piesă Roșie</div>
            </div>
            <div class="msg" id="msg1">Piese fixate în perete: 0 / 9</div>
            <button class="btn" style="display:none;" id="nextBtn1" onclick="currentLevel=2; loadLevel2();">Treci la Nivelul 2</button>
        `;
    }

    function placeWallTile(tileElement) {
        if (tileElement.style.opacity === "0.3") return;
        tileElement.style.opacity = "0.3";
        tileElement.style.pointerEvents = "none";
        wallProgress++;

        const msg = document.getElementById("msg1");
        if (wallProgress === targetWall) {
            msg.innerHTML = `<span class="success">🎉 Peretele LEGO este complet și extrem de solid! Hoarda e oprită!</span>`;
            document.getElementById("nextBtn1").style.display = "inline-block";
        } else {
            msg.innerHTML = `<span class="success">✔️ Piesa fixată! Rămase: ${targetWall - wallProgress}</span>`;
        }
    }

    // ==========================================
    // NIVELUL 2: Ferește-te de zombii (Mătură & Coasă) - Animat & Lent
    // ==========================================
    let animId;
    function loadLevel2() {
        hud.innerText = "Nivelul 2: Evită Hoarda Kiseleff (Mătură & Coasă) 🏃‍♂️";
        screen.innerHTML = `
            <p style="margin:0 0 5px 0; font-size:12px;">Apasă <b>SPACEBAR</b> sau <b>Click</b> pe ecran ca să sari peste cei 8 zombii care vin mai încet! Fii atent la arme!</p>
            <canvas id="c2" width="540" height="180"></canvas>
            <div class="msg" id="msg2">Zombii rămași de evitat: 8 | Supraviețuiește!</div>
        `;

        const canvas = document.getElementById("c2");
        const ctx = canvas.getContext("2d");

        // Caracter animat (supraviețuitorul)
        let p = { x: 50, y: 115, w: 22, h: 40, dy: 0, jump: -9.5, g: 0.5, grounded: true, legAnim: 0 };
        
        // Hoardă de 8 zombii care vin mai lent și au mătura / coasa în mâini
        let zombies = [];
        for(let i=0; i<8; i++) {
            zombies.push({
                x: 600 + i * 220, // Distanțați între ei
                y: 110,
                w: 26,
                h: 45,
                speed: 2.2, // Mai lent
                hasWeapon: i % 2 === 0 ? "matura" : "coasa",
                anim: 0
            });
        }

        let passedZombies = 0;

        function jumpHandler(e) {
            if (e.code === "Space" || e.type === "click") {
                if (p.grounded) { p.dy = p.jump; p.grounded = false; }
            }
        }
        document.addEventListener("keydown", jumpHandler);
        canvas.addEventListener("click", jumpHandler);

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Fizică jucător
            p.dy += p.g; p.y += p.dy;
            if (p.y > 115) { p.y = 115; p.dy = 0; p.grounded = true; }
            if(!p.grounded) p.legAnim += 0.2;

            // Desenare sol cu zăpadă
            ctx.fillStyle = "#334155"; ctx.fillRect(0, 155, canvas.width, 25);
            ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 155, canvas.width, 3);

            // Desenare Caracter Animat (Supraviețuitorul)
            ctx.fillStyle = "#38bdf8"; 
            ctx.fillRect(p.x, p.y, p.w, p.h); // Corp
            ctx.fillStyle = "#facc15"; ctx.fillRect(p.x + 3, p.y - 10, 16, 12); // Cap
            // Picioare animate
            ctx.fillStyle = "#1e293b";
            let legOffset = Math.sin(p.legAnim) * 5;
            ctx.fillRect(p.x + 3, p.y + p.h, 5, 10 + (p.grounded ? legOffset : 0));
            ctx.fillRect(p.x + 14, p.y + p.h, 5, 10 - (p.grounded ? legOffset : 0));

            // Gestionare zombii animați
            for (let i = 0; i < zombies.length; i++) {
                let z = zombies[i];
                z.x -= z.speed;
                z.anim += 0.1;

                // Coliziune
                if (p.x < z.x + z.w && p.x + p.w > z.x && p.y < z.y + z.h && p.y + p.h > z.y) {
                    cancelAnimationFrame(animId);
                    document.removeEventListener("keydown", jumpHandler);
                    document.getElementById("msg2").innerHTML = `<span class='error'>💀 Te-a prins zombiul! <button class='btn' onclick='loadLevel2()'>Reîncearcă</button></span>`;
                    return;
                }

                // Desenează Zombiul Animat
                ctx.fillStyle = "#10b981"; ctx.fillRect(z.x, z.y, z.w, z.h); // Corp verde zombi
                ctx.fillStyle = "#047857"; ctx.fillRect(z.x + 4, z.y - 9, 18, 12); // Cap zombi
                
                // Mâna cu Arma (Mătura sau Coasa vizibilă clar!)
                ctx.fillStyle = "#94a3b8";
                if (z.hasWeapon === "matura") {
                    // Mătură lungă desenată în mână
                    ctx.fillRect(z.x + z.w, z.y + 15, 18, 3); // Coada
                    ctx.fillStyle = "#b45309"; ctx.fillRect(z.x + z.w + 12, z.y + 10, 8, 12); // Peria măturii
                } else {
                    // Coasă desenată în mână
                    ctx.fillRect(z.x + z.w, z.y + 10, 15, 3); // Coada
                    ctx.fillStyle = "#e2e8f0"; ctx.fillRect(z.x + z.w + 12, z.y + 2, 10, 10); // Lama coasei
                }
            }

            // Verifică dacă au trecut toți cei 8 zombii
            if (zombies[zombies.length - 1].x < -50) {
                cancelAnimationFrame(animId);
                document.removeEventListener("keydown", jumpHandler);
                screen.innerHTML = `<h3 style="color:#34d399; margin:10px 0;">🎉 Nivelul 2 trecut! Ai evitat toți cei 8 zombii cu mătura și coasa!</h3><button class='btn' onclick='currentLevel=3; loadLevel3();'>Treci la Puzzle Foto</button>`;
                return;
            }

            animId = requestAnimationFrame(loop);
        }
        loop();
    }

    // ==========================================
    // NIVELUL 3: Puzzle Foto cu Voi Doi
    // ==========================================
    function loadLevel3() {
        hud.innerText = "Nivelul 3: Reconstruiește Amintirea (Puzzle Foto) 🧩";
        screen.innerHTML = `
            <p style="font-size:12px; margin:0 0 10px 0;">Mută piesele prin click în spațiul gol până se așază în ordine (1 la 8):</p>
            <div class="puzzle-grid" id="puzzleBoard"></div>
            <div class="msg" id="msg3"></div>
            <button class="btn" style="margin-top:10px;" onclick="solvePuzzleManually()">Rezolvă rapid (Test)</button>
        `;
        initPuzzle();
    }

    let tiles = [1, 3, 2, 4, 6, 5, 7, 8, ""];
    function initPuzzle() { renderPuzzle(); }

    function renderPuzzle() {
        const board = document.getElementById("puzzleBoard");
        board.innerHTML = "";
        tiles.forEach((val, idx) => {
            const tile = document.createElement("div");
            tile.className = `puzzle-tile ${val === "" ? "empty" : ""}`;
            tile.innerText = val;
            tile.onclick = () => moveTile(idx);
            board.appendChild(tile);
        });
    }

    function moveTile(idx) {
        let emptyIdx = tiles.indexOf("");
        let validMoves = [emptyIdx - 1, emptyIdx + 1, emptyIdx - 3, emptyIdx + 3];
        if (validMoves.includes(idx)) {
            tiles[emptyIdx] = tiles[idx];
            tiles[idx] = "";
            renderPuzzle();
            checkPuzzleWin();
        }
    }

    function checkPuzzleWin() {
        const winningState = [1, 2, 3, 4, 5, 6, 7, 8, ""];
        if (tiles.every((val, i) => val === winningState[i])) {
            document.getElementById("msg3").innerHTML = `<span class="success">🎉 Puzzle completat! Amintirea a fost refăcută!</span>`;
            setTimeout(() => { loadVictoryScreen(); }, 1500);
        }
    }

    function solvePuzzleManually() {
        tiles = [1, 2, 3, 4, 5, 6, 7, 8, ""];
        renderPuzzle();
        document.getElementById("msg3").innerHTML = `<span class="success">🎉 Puzzle completat!</span>`;
        setTimeout(() => { loadVictoryScreen(); }, 1200);
    }

    // ==========================================
    // FINALUL: Victorie & Cadou
    // ==========================================
    function loadVictoryScreen() {
        hud.innerText = "MISIUNE ÎNDEPLINITĂ 🏆";
        screen.innerHTML = `
            <h2 style="color: #34d399; margin-top:0;">🌟 AI SUPRAVIEȚUIT APOCALIPSEI ZOMBIE! 🌟</h2>
            <p style="font-size: 13px; line-height: 1.5; text-align: left; background: #0f172a; padding: 12px; border-radius: 8px; margin:0;">
                Baza ta a rezistat atacului, cei 8 zombii cu mături și coase au fost depășiți, iar amintirile au fost restaurate!<br><br>
                🎁 <b>PREMIUL TĂU FIZIC:</b><br>
                Cadoul tău secret te așteaptă la iubita ta (fără să știi exact ce e în cutie!).<br><br>
                <b>Protocolul obligatoriu de ridicare:</b><br>
                1. Du-te la ea și dă-i un pupic cald 😘<br>
                2. Execută codul vostru secret de „I love you”: <b>apasă de 3 ori în orice loc</b> 👆✨
            </p>
        `;
    }

    loadLevel1();
</script>

</body>
</html>
