<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xmas Zombie Apocalypse Quest 🎄🧟‍♂️</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 95vh;
            user-select: none;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: #1e293b;
            border: 3px solid #38bdf8;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        h1 { color: #f43f5e; margin-top: 0; font-size: 22px; }
        .hud { font-size: 14px; color: #38bdf8; margin-bottom: 12px; font-weight: bold; }

        .game-screen {
            background: #090d16;
            border: 2px dashed #475569;
            border-radius: 10px;
            padding: 15px;
            min-height: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .btn {
            background-color: #10b981;
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            font-family: 'Courier New', Courier, monospace;
        }
        .btn:hover { background-color: #059669; color: white; }

        /* Nivel 1: Paletă piese LEGO pentru Drag & Drop */
        .lego-palette {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            justify-content: center;
        }
        .lego-source-brick {
            width: 65px;
            height: 32px;
            border-radius: 4px;
            cursor: grab;
            box-shadow: inset 0 2px 3px rgba(255,255,255,0.4), 0 3px 5px rgba(0,0,0,0.4);
            border-bottom: 3px solid rgba(0,0,0,0.4);
        }
        .lego-source-brick:active { cursor: grabbing; }

        .lego-pattern-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            background: #1e293b;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #475569;
            margin-bottom: 12px;
            width: 270px;
        }
        .lego-slot {
            height: 42px;
            background: #0f172a;
            border: 2px dashed #64748b;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #64748b;
            transition: background 0.2s;
        }
        .lego-slot.drag-over {
            background: #334155;
            border-color: #38bdf8;
        }

        .bg-red { background-color: #dc2626; }
        .bg-yellow { background-color: #eab308; }
        .bg-blue { background-color: #2563eb; }
        .bg-green { background-color: #16a34a; }

        canvas { background: #111827; border: 2px solid #374151; border-radius: 6px; display: block; margin: 0 auto; }
        
        .puzzle-grid { display: grid; grid-template-columns: repeat(3, 80px); grid-template-rows: repeat(3, 80px); gap: 3px; background: #334155; padding: 3px; border-radius: 6px; }
        .puzzle-tile { background: #2563eb; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: white; cursor: pointer; user-select: none; }
        .puzzle-tile.empty { background: #0f172a; cursor: default; }

        .msg { margin-top: 10px; font-weight: bold; font-size: 12px; }
        .error { color: #f43f5e; }
        .success { color: #34d399; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🧟‍♂️ Xmas Zombie Quest 🎄🧱</h1>
        <div class="hud" id="hudTitle">Nivelul 1: Construirea Peretelui LEGO</div>
        <div class="game-screen" id="screen"></div>
    </div>

<script>
    const screen = document.getElementById("screen");
    const hud = document.getElementById("hudTitle");
    let currentLevel = 1;

    // ==========================================
    // NIVELUL 1: Drag & Drop pe Pattern de Perete LEGO (9 piese)
    // ==========================================
    let placedCount = 0;
    function loadLevel1() {
        placedCount = 0;
        hud.innerText = "Nivelul 1: Drag & Drop - Perete LEGO 🧱";
        screen.innerHTML = `
            <p style="font-size:12px; margin:0 0 10px 0;">Trage piesele din paletă și plasează-le în cele <b>9 sloturi</b> ale peretelui:</p>
            
            <div class="lego-palette">
                <div class="lego-source-brick bg-red" draggable="true" ondragstart="drag(event, 'red')"></div>
                <div class="lego-source-brick bg-yellow" draggable="true" ondragstart="drag(event, 'yellow')"></div>
                <div class="lego-source-brick bg-blue" draggable="true" ondragstart="drag(event, 'blue')"></div>
                <div class="lego-source-brick bg-green" draggable="true" ondragstart="drag(event, 'green')"></div>
            </div>

            <div class="lego-pattern-grid" id="patternGrid">
                <div class="lego-slot" ondragover="allowDrop(event)" ondragleave="removeHL(event)" ondrop="dropToSlot(event)">1</div>
                <div class="lego-slot" ondragover="allowDrop(event)" ondragleave="removeHL(event)" ondrop="dropToSlot(event)">2</div>
                <div class="lego-slot" ondragover="allowDrop(event)" ondragleave="removeHL(event)" ondrop="dropToSlot(event)">3</div>
                <div class="lego-slot" ondragover="allowDrop(event)" ondragleave="removeHL(event)" ondrop="dropToSlot(event)">4</div>
                <div class="lego-slot" ondragover="allowDrop(event)" ondragleave="removeHL(event)" ondrop="dropToSlot(event)">5</div>
                <div class="lego-slot" ondragover="allowDrop(event)" ondragleave="removeHL(event)" ondrop="dropToSlot(event)">6</div>
                <div class="lego-slot" ondragover="allowDrop(event)" ondragleave="removeHL(event)" ondrop="dropToSlot(event)">7</div>
                <div class="lego-slot" ondragover="allowDrop(event)" ondragleave="removeHL(event)" ondrop="dropToSlot(event)">8</div>
                <div class="lego-slot" ondragover="allowDrop(event)" ondragleave="removeHL(event)" ondrop="dropToSlot(event)">9</div>
            </div>

            <div class="msg" id="msg1">Piese montate în perete: 0 / 9</div>
            <button class="btn" style="display:none;" id="nextBtn1" onclick="currentLevel=2; loadLevel2();">Treci la Nivelul 2</button>
        `;
    }

    function allowDrop(ev) {
        ev.preventDefault();
        ev.target.classList.add("drag-over");
    }

    function removeHL(ev) {
        ev.target.classList.remove("drag-over");
    }

    function drag(ev, color) {
        ev.dataTransfer.setData("text", color);
    }

    function dropToSlot(ev) {
        ev.preventDefault();
        let slot = ev.target;
        slot.classList.remove("drag-over");

        if (slot.classList.contains("lego-slot") && !slot.hasAttribute("data-filled")) {
            const color = ev.dataTransfer.getData("text");
            if (!color) return;

            slot.setAttribute("data-filled", "true");
            slot.style.backgroundColor = color === 'red' ? '#dc2626' : (color === 'yellow' ? '#eab308' : (color === 'blue' ? '#2563eb' : '#16a34a'));
            slot.style.borderStyle = "solid";
            slot.style.borderColor = "rgba(255,255,255,0.4)";
            slot.innerText = "";
            placedCount++;

            const msg = document.getElementById("msg1");
            if (placedCount === 9) {
                msg.innerHTML = `<span class="success">🎉 Peretele LEGO este complet montat prin Drag & Drop! Hoarda e oprită!</span>`;
                document.getElementById("nextBtn1").style.display = "inline-block";
            } else {
                msg.innerHTML = `<span class="success">✔️ Piesă fixată în perete! Rămase: ${9 - placedCount}</span>`;
            }
        }
    }

    // ==========================================
    // NIVELUL 2: Ferește-te de zombii (Salt lung, 8 zombii lenți, mătura & coasa)
    // ==========================================
    let animId;
    function loadLevel2() {
        hud.innerText = "Nivelul 2: Evită Hoarda Kiseleff (Mătură & Coasă) 🏃‍♂️";
        screen.innerHTML = `
            <p style="margin:0 0 5px 0; font-size:12px;">Apasă <b>SPACEBAR</b> sau <b>Click</b> ca să faci un salt lung peste cei 8 zombii lenți!</p>
            <canvas id="c2" width="540" height="180"></canvas>
            <div class="msg" id="msg2">Supraviețuiește trecerii hoartei!</div>
        `;

        const canvas = document.getElementById("c2");
        const ctx = canvas.getContext("2d");

        // Salt mult mai lung și mai înalt
        let p = { x: 50, y: 115, w: 22, h: 40, dy: 0, jump: -12.5, g: 0.45, grounded: true, legAnim: 0 };
        
        let zombies = [];
        for(let i=0; i<8; i++) {
            zombies.push({
                x: 620 + i * 240, // Distanțați mai larg
                y: 110,
                w: 26,
                h: 45,
                speed: 2.0, // Foarte lenți
                hasWeapon: i % 2 === 0 ? "matura" : "coasa"
            });
        }

        function jumpHandler(e) {
            if (e.code === "Space" || e.type === "click") {
                if (p.grounded) { p.dy = p.jump; p.grounded = false; }
            }
        }
        document.addEventListener("keydown", jumpHandler);
        canvas.addEventListener("click", jumpHandler);

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            p.dy += p.g; p.y += p.dy;
            if (p.y > 115) { p.y = 115; p.dy = 0; p.grounded = true; }
            if(!p.grounded) p.legAnim += 0.2;

            ctx.fillStyle = "#334155"; ctx.fillRect(0, 155, canvas.width, 25);
            ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 155, canvas.width, 3);

            // Caracter animat
            ctx.fillStyle = "#38bdf8"; ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.fillStyle = "#facc15"; ctx.fillRect(p.x + 3, p.y - 10, 16, 12);
            ctx.fillStyle = "#1e293b";
            let legOffset = Math.sin(p.legAnim) * 5;
            ctx.fillRect(p.x + 3, p.y + p.h, 5, 10 + (p.grounded ? legOffset : 0));
            ctx.fillRect(p.x + 14, p.y + p.h, 5, 10 - (p.grounded ? legOffset : 0));

            for (let i = 0; i < zombies.length; i++) {
                let z = zombies[i];
                z.x -= z.speed;

                if (p.x < z.x + z.w && p.x + p.w > z.x && p.y < z.y + z.h && p.y + p.h > z.y) {
                    cancelAnimationFrame(animId);
                    document.removeEventListener("keydown", jumpHandler);
                    document.getElementById("msg2").innerHTML = `<span class='error'>💀 Te-a prins zombiul! <button class='btn' onclick='loadLevel2()'>Reîncearcă</button></span>`;
                    return;
                }

                ctx.fillStyle = "#10b981"; ctx.fillRect(z.x, z.y, z.w, z.h);
                ctx.fillStyle = "#047857"; ctx.fillRect(z.x + 4, z.y - 9, 18, 12);
                
                // Mătura sau Coasa în mână
                ctx.fillStyle = "#94a3b8";
                if (z.hasWeapon === "matura") {
                    ctx.fillRect(z.x + z.w, z.y + 15, 18, 3);
                    ctx.fillStyle = "#b45309"; ctx.fillRect(z.x + z.w + 12, z.y + 10, 8, 12);
                } else {
                    ctx.fillRect(z.x + z.w, z.y + 10, 15, 3);
                    ctx.fillStyle = "#e2e8f0"; ctx.fillRect(z.x + z.w + 12, z.y + 2, 10, 10);
                }
            }

            if (zombies[zombies.length - 1].x < -50) {
                cancelAnimationFrame(animId);
                document.removeEventListener("keydown", jumpHandler);
                screen.innerHTML = `<h3 style="color:#34d399; margin:10px 0;">🎉 Nivelul 2 trecut! Ai evitat toți zombii cu mătura și coasa!</h3><button class='btn' onclick='currentLevel=3; loadLevel3();'>Treci la Puzzle Foto</button>`;
                return;
            }

            animId = requestAnimationFrame(loop);
        }
        loop();
    }

    // ==========================================
    // NIVELUL 3: Puzzle Foto cu Voi Doi
    // ==========================================
    function loadLevel3() {
        hud.innerText = "Nivelul 3: Reconstruiește Amintirea (Puzzle Foto) 🧩";
        screen.innerHTML = `
            <p style="font-size:12px; margin:0 0 10px 0;">Mută piesele prin click în spațiul gol până se așază în ordine (1 la 8):</p>
            <div class="puzzle-grid" id="puzzleBoard"></div>
            <div class="msg" id="msg3"></div>
            <button class="btn" style="margin-top:10px;" onclick="solvePuzzleManually()">Rezolvă rapid (Test)</button>
        `;
        initPuzzle();
    }

    let tiles = [1, 3, 2, 4, 6, 5, 7, 8, ""];
    function initPuzzle() { renderPuzzle(); }

    function renderPuzzle() {
        const board = document.getElementById("puzzleBoard");
        board.innerHTML = "";
        tiles.forEach((val, idx) => {
            const tile = document.createElement("div");
            tile.className = `puzzle-tile ${val === "" ? "empty" : ""}`;
            tile.innerText = val;
            tile.onclick = () => moveTile(idx);
            board.appendChild(tile);
        });
    }

    function moveTile(idx) {
        let emptyIdx = tiles.indexOf("");
        let validMoves = [emptyIdx - 1, emptyIdx + 1, emptyIdx - 3, emptyIdx + 3];
        if (validMoves.includes(idx)) {
            tiles[emptyIdx] = tiles[idx];
            tiles[idx] = "";
            renderPuzzle();
            checkPuzzleWin();
        }
    }

    function checkPuzzleWin() {
        const winningState = [1, 2, 3, 4, 5, 6, 7, 8, ""];
        if (tiles.every((val, i) => val === winningState[i])) {
            document.getElementById("msg3").innerHTML = `<span class="success">🎉 Puzzle completat! Amintirea a fost refăcută!</span>`;
            setTimeout(() => { loadVictoryScreen(); }, 1500);
        }
    }

    function solvePuzzleManually() {
        tiles = [1, 2, 3, 4, 5, 6, 7, 8, ""];
        renderPuzzle();
        document.getElementById("msg3").innerHTML = `<span class="success">🎉 Puzzle completat!</span>`;
        setTimeout(() => { loadVictoryScreen(); }, 1200);
    }

    // ==========================================
    // FINALUL: Victorie & Cadou
    // ==========================================
    function loadVictoryScreen() {
        hud.innerText = "MISIUNE ÎNDEPLINITĂ 🏆";
        screen.innerHTML = `
            <h2 style="color: #34d399; margin-top:0;">🌟 AI SUPRAVIEȚUIT APOCALIPSEI ZOMBIE! 🌟</h2>
            <p style="font-size: 13px; line-height: 1.5; text-align: left; background: #0f172a; padding: 12px; border-radius: 8px; margin:0;">
                Baza ta a rezistat atacului, cei 8 zombii cu mături și coase au fost depășiți, iar amintirile au fost restaurate!<br><br>
                🎁 <b>PREMIUL TĂU FIZIC:</b><br>
                Cadoul tău secret te așteaptă la iubita ta (fără să știi exact ce e în cutie!).<br><br>
                <b>Protocolul obligatoriu de ridicare:</b><br>
                1. Du-te la ea și dă-i un pupic cald 😘<br>
                2. Execută codul vostru secret de „I love you”: <b>apasă de 3 ori în orice loc</b> 👆✨
            </p>
        `;
    }

    loadLevel1();
</script>

</body>
</html>
