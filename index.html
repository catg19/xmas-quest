<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xmas Zombie Apocalypse Quest 🎄🧟‍♂️</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 95vh;
            user-select: none;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: #1e293b;
            border: 3px solid #38bdf8;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        h1 { color: #f43f5e; margin-top: 0; font-size: 22px; }
        .hud { font-size: 14px; color: #38bdf8; margin-bottom: 15px; font-weight: bold; }

        .game-screen {
            background: #090d16;
            border: 2px dashed #475569;
            border-radius: 10px;
            padding: 20px;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .btn {
            background-color: #10b981;
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            font-family: 'Courier New', Courier, monospace;
        }
        .btn:hover { background-color: #059669; color: white; }

        /* Stiliști Nivel 1 - Stivuire LEGO */
        .lego-pool { display: flex; gap: 10px; margin-bottom: 15px; }
        .lego-block {
            width: 70px; height: 35px; border-radius: 4px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 12px; color: white; border: 2px solid rgba(255,255,255,0.4);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        .lego-block:hover { transform: scale(1.05); }

        .wall-slot-container {
            width: 140px; height: 160px; border: 2px dashed #334155; border-radius: 6px;
            display: flex; flex-direction: column-reverse; align-items: center; justify-content: flex-start;
            padding: 5px; background: #0f172a; gap: 4px;
        }
        .placed-brick {
            width: 120px; height: 32px; border-radius: 4px; display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold; font-size: 12px; border: 2px solid rgba(255,255,255,0.3);
        }

        .bg-red { background: #dc2626; }
        .bg-green { background: #16a34a; }
        .bg-blue { background: #2563eb; }

        canvas { background: #111827; border: 2px solid #374151; border-radius: 6px; display: block; margin: 0 auto; }
        .puzzle-grid { display: grid; grid-template-columns: repeat(3, 80px); grid-template-rows: repeat(3, 80px); gap: 3px; background: #334155; padding: 3px; border-radius: 6px; }
        .puzzle-tile { background: #2563eb; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: white; cursor: pointer; user-select: none; }
        .puzzle-tile.empty { background: #0f172a; cursor: default; }

        .msg { margin-top: 12px; font-weight: bold; font-size: 13px; }
        .error { color: #f43f5e; }
        .success { color: #34d399; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🧟‍♂️ Xmas Zombie Quest 🎄🧱</h1>
        <div class="hud" id="hudTitle">Nivelul 1: Construirea Zidului de Apărare</div>
        <div class="game-screen" id="screen"></div>
    </div>

                <div class="lego-block bg-blue" onclick="stackBrick('blue', 'Albastru')">Albastru</div>

            <button class="btn" style="display:none;" id="nextBtn1" onclick="currentLevel=2; loadLevel2();">Treci la Nivelul 2</button>
        `;
    }
