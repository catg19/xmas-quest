<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xmas Zombie Quest</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background: #1e293b;
            border: 3px solid #38bdf8;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
        }
        h1 { color: #f43f5e; font-size: 20px; margin-top: 0; }
        .hud { font-size: 14px; color: #38bdf8; margin-bottom: 15px; font-weight: bold; }
        .screen {
            background: #090d16;
            border: 2px dashed #475569;
            border-radius: 8px;
            padding: 20px;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .btn {
            background-color: #10b981;
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn:hover { background-color: #059669; color: white; }
        .palette { display: flex; gap: 10px; margin-bottom: 15px; }
        .brick {
            width: 65px; height: 32px; border-radius: 4px; cursor: grab;
        }
        .brick:active { cursor: grabbing; }
        .wall {
            display: flex; flex-direction: column; gap: 4px; background: #1e293b; padding: 10px; border-radius: 6px; width: 260px; align-items: center;
        }
        .row { display: flex; gap: 4px; }
        .row.offset { margin-left: 20px; }
        .slot {
            width: 75px; height: 35px; background: #0f172a; border: 2px dashed #64748b; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #64748b;
        }
        .slot.drag-over { background: #334155; border-color: #38bdf8; }
        .red { background-color: #dc2626; }
        .yellow { background-color: #eab308; }
        .blue { background-color: #2563eb; }
        .green { background-color: #16a34a; }
        canvas { background: #111827; border: 2px solid #374151; border-radius: 6px; display: block; margin: 0 auto; }
        .terminal {
            background: #020617; border: 2px solid #22c55e; border-radius: 8px; padding: 15px; width: 90%; max-width: 400px; text-align: left; color: #22c55e;
        }
        .t-input {
            background: #0f172a; border: 1px solid #22c55e; color: #22c55e; padding: 8px; width: calc(100% - 18px); margin-top: 10px; font-family: monospace; font-size: 14px; outline: none; border-radius: 4px;
        }
        .msg { margin-top: 10px; font-weight: bold; font-size: 13px; }
        .error { color: #f43f5e; }
        .success { color: #34d399; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧟‍♂️ Xmas Zombie Quest 🎄🧱</h1>
        <div class="hud" id="hud">Nivelul 1: Construirea Peretelui LEGO</div>
        <div class="screen" id="screen"></div>
    </div>

<script>
    const screen = document.getElementById("screen");
    const hud = document.getElementById("hud");

    // ================= LEVEL 1 =================
    let placed = 0;
    function loadL1() {
        placed = 0;
        hud.innerText = "Nivelul 1: Perete LEGO (Drag & Drop)";
        screen.innerHTML = `
            <p style="font-size:12px; margin:0 0 10px 0;">Trage piesele LEGO în cele 9 sloturi:</p>
            <div class="palette">
                <div class="brick red" draggable="true" ondragstart="event.dataTransfer.setData('text', 'red')"></div>
                <div class="brick yellow" draggable="true" ondragstart="event.dataTransfer.setData('text', 'yellow')"></div>
                <div class="brick blue" draggable="true" ondragstart="event.dataTransfer.setData('text', 'blue')"></div>
                <div class="brick green" draggable="true" ondragstart="event.dataTransfer.setData('text', 'green')"></div>
            </div>
            <div class="wall">
                <div class="row">
                    <div class="slot" ondragover="event.preventDefault(); this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="drop(event)">1</div>
                    <div class="slot" ondragover="event.preventDefault(); this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="drop(event)">2</div>
                    <div class="slot" ondragover="event.preventDefault(); this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="drop(event)">3</div>
                </div>
                <div class="row offset">
                    <div class="slot" ondragover="event.preventDefault(); this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="drop(event)">4</div>
                    <div class="slot" ondragover="event.preventDefault(); this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="drop(event)">5</div>
                    <div class="slot" ondragover="event.preventDefault(); this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="drop(event)">6</div>
                </div>
                <div class="row">
                    <div class="slot" ondragover="event.preventDefault(); this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="drop(event)">7</div>
                    <div class="slot" ondragover="event.preventDefault(); this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="drop(event)">8</div>
                    <div class="slot" ondragover="event.preventDefault(); this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="drop(event)">9</div>
                </div>
            </div>
            <div class="msg" id="m1">Piese: 0 / 9</div>
            <button class="btn" id="n1" style="display:none;" onclick="loadL2()">Treci la Nivelul 2</button>
        `;
    }

    function drop(e) {
        e.preventDefault();
        let slot = e.target;
        slot.classList.remove("drag-over");
        if (slot.classList.contains("slot") && !slot.hasAttribute("data-f")) {
            let col = e.dataTransfer.getData("text");
            if (!col) return;
            slot.setAttribute("data-f", "1");
            slot.className = "slot " + col;
            slot.innerText = "";
            placed++;
            if (placed === 9) {
                document.getElementById("m1").innerHTML = `<span class="success">🎉 Perete completat!</span>`;
                document.getElementById("n1").style.display = "inline-block";
            } else {
                document.getElementById("m1").innerText = `Piese: ${placed} / 9`;
            }
        }
    }

    // ================= LEVEL 2 =================
    let anim;
    function loadL2() {
        hud.innerText = "Nivelul 2: Evită Hoarda Kiseleff";
        screen.innerHTML = `
            <p style="margin:0 0 5px 0; font-size:12px;">Apasă <b>Spacebar</b> sau <b>Click</b> pentru salt lung:</p>
            <canvas id="c" width="500" height="170"></canvas>
            <div class="msg" id="m2">Supraviețuiește hoartei!</div>
        `;
        let canvas = document.getElementById("c");
        let ctx = canvas.getContext("2d");
        let p = { x: 40, y: 110, w: 22, h: 40, dy: 0, jump: -12.5, g: 0.45, grounded: true };
        let z = [];
        for(let i=0; i<8; i++) {
            z.push({ x: 580 + i * 230, y: 105, w: 25, h: 45, speed: 2.0, wpn: i % 2 === 0 ? "m" : "c" });
        }

        function handleJump(e) {
            if (e.code === "Space" || e.type === "click") {
                if (p.grounded) { p.dy = p.jump; p.grounded = false; }
            }
        }
        document.addEventListener("keydown", handleJump);
        canvas.addEventListener("click", handleJump);

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            p.dy += p.g; p.y += p.dy;
            if (p.y > 110) { p.y = 110; p.dy = 0; p.grounded = true; }

            ctx.fillStyle = "#334155"; ctx.fillRect(0, 145, canvas.width, 25);

            // Jucător
            ctx.fillStyle = "#38bdf8"; ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.fillStyle = "#facc15"; ctx.fillRect(p.x + 3, p.y - 8, 16, 10);

            for(let i=0; i<z.length; i++) {
                let zb = z[i];
                zb.x -= zb.speed;
                if (p.x < zb.x + zb.w && p.x + p.w > zb.x && p.y < zb.y + zb.h && p.y + p.h > zb.y) {
                    cancelAnimationFrame(anim);
                    document.removeEventListener("keydown", handleJump);
                    document.getElementById("m2").innerHTML = `<span class="error">💀 Te-a prins! <button class="btn" onclick="loadL2()">Reîncearcă</button></span>`;
                    return;
                }
                ctx.fillStyle = "#10b981"; ctx.fillRect(zb.x, zb.y, zb.w, zb.h);
                ctx.fillStyle = "#047857"; ctx.fillRect(zb.x + 4, zb.y - 8, 17, 10);
                // Arma
                ctx.fillStyle = "#94a3b8";
                ctx.fillRect(zb.x + zb.w, zb.y + 15, 15, 3);
            }

            if (z[z.length - 1].x < -50) {
                cancelAnimationFrame(anim);
                document.removeEventListener("keydown", handleJump);
                screen.innerHTML = `<h3 style="color:#34d399;">🎉 Nivelul 2 trecut!</h3><button class="btn" onclick="loadL3()">Treci la Nivelul 3</button>`;
                return;
            }
            anim = requestAnimationFrame(loop);
        }
        loop();
    }

    // ================= LEVEL 3 =================
    function loadL3() {
        hud.innerText = "Nivelul 3: Terminalul de Securitate";
        screen.innerHTML = `
            <div class="terminal">
                <p style="margin:0 0 6px 0; color:#22c55e;">> [SYSTEM]: Firewall activat.</p>
                <p style="margin:0 0 10px 0; font-size:11px; color:#4ade80;">> Indiciu: Introdu codul (denumirea pe care a pus-o iubita ta cad
