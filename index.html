<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEGO Zombie Xmas Runner 🎄🧟‍♂️</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #gameContainer {
            text-align: center;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            border: 3px solid #38bdf8;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        canvas {
            background: linear-gradient(to bottom, #1e293b, #0f172a);
            border: 2px solid #475569;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
        }

        .instructions {
            margin-top: 15px;
            font-size: 14px;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <h2 style="margin: 0 0 10px 0; color: #f43f5e;">🧟‍♂️ LEGO Zombie Xmas Runner 🧱🎄</h2>
        <canvas id="gameCanvas" width="700" height="300"></canvas>
        <div class="instructions">Apasă <b>SPACEBAR</b> sau <b>Click pe ecran</b> ca să sari peste zombii și obstacole!</div>
    </div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Stările jocului
    let gameStarted = false;
    let gameOver = false;
    let gameWon = false;
    let score = 0;
    const winningScore = 300; // Câștigă după ce adună dest urmă

    // Jucătorul (Figurina LEGO)
    let player = {
        x: 50,
        y: 210,
        width: 30,
        height: 50,
        dy: 0,
        jumpPower: -11,
        gravity: 0.6,
        grounded: true,
        color: "#f43f5e"
    };

    // Obstacolele (Zombii / Bariere de Crăciun)
    let obstacles = [];
    let obstacleTimer = 0;

    // Ascultător pentru taste / click
    document.addEventListener("keydown", function(e) {
        if (e.code === "Space") {
            e.preventDefault();
            triggerJump();
        }
    });

    canvas.addEventListener("click", function() {
        triggerJump();
    });

    function triggerJump() {
        if (!gameStarted) {
            gameStarted = true;
        } else if (player.grounded && !gameOver && !gameWon) {
            player.dy = player.jumpPower;
            player.grounded = false;
        } else if (gameOver || gameWon) {
            resetGame();
        }
    }

    function resetGame() {
        gameOver = false;
        gameWon = false;
        score = 0;
        obstacles = [];
        player.y = 210;
        player.dy = 0;
        player.grounded = true;
        gameStarted = true;
    }

    // Generare obstacole
    function spawnObstacle() {
        obstacleTimer++;
        if (obstacleTimer > 90) { // Frecvența obstacolelor
            obstacles.push({
                x: canvas.width,
                y: 220,
                width: 25,
                height: 40,
                color: "#10b981" // Zombii verzi
            });
            obstacleTimer = 0;
        }
    }

    // Bucla principală a jocului
    function update() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Desenare cer / fundal festiv
        ctx.fillStyle = "#38bdf8";
        ctx.font = "12px Courier New";
        ctx.fillText("🌟 🎄 🎁 🎅 ❄️ 🧱 🧟‍♂️ 🎄 🌟", 150, 30);

        if (!gameStarted) {
            // Ecran Start
            ctx.fillStyle = "#ffffff";
            ctx.font = "20px Courier New";
            ctx.textAlign = "center";
            ctx.fillText("APASĂ SPACE SAU CLICK PENTRU START", canvas.width / 2, canvas.height / 2);
            ctx.textAlign = "left";
            requestAnimationFrame(update);
            return;
        }

        if (!gameOver && !gameWon) {
            // Gravitație jucător
            player.dy += player.gravity;
            player.y += player.dy;

            // Solul
            if (player.y > 210) {
                player.y = 210;
                player.dy = 0;
                player.grounded = true;
            }

            // Scor
            score++;
            if (score >= winningScore) {
                gameWon = true;
            }

            // Gestionare obstacole
            spawnObstacle();

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= 5; // Viteza de deplasare

                // Coliziune (Bynary box check)
                if (
                    player.x < obstacles[i].x + obstacles[i].width &&
                    player.x + player.width > obstacles[i].x &&
                    player.y < obstacles[i].y + obstacles[i].height &&
                    player.y + player.height > obstacles[i].y
                ) {
                    gameOver = true;
                }

                // Ștergere obstacole ieșite din ecran
                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                }
            }
        }

        // --- DESENARE ELEMENTE PE ECRAN ---

        // Solul
        ctx.fillStyle = "#334155";
        ctx.fillRect(0, 260, canvas.width, 40);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 260, canvas.width, 4); // Zăpadă pe sol

        // Jucătorul (Figurina LEGO stilizată)
        ctx.fillStyle = player.color;
        ctx.fillRect(player.x, player.y, player.width, player.height);
        // Cap LEGO
        ctx.fillStyle = "#facc15";
        ctx.fillRect(player.x + 5, player.y - 12, 20, 15);

        // Obstacolele (Zombii)
        for (let obs of obstacles) {
            ctx.fillStyle = obs.color;
            ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            // Căciuliță mică de Crăciun pe zombi
            ctx.fillStyle = "#ef4444";
            ctx.fillRect(obs.x + 2, obs.y - 8, 15, 8);
        }

        // Afișare scor
        ctx.fillStyle = "#ffffff";
        ctx.font = "16px Courier New";
        ctx.fillText("Progres Bază: " + Math.floor((score / winningScore) * 100) + "%", 20, 30);

        // Ecran de Game Over
        if (gameOver) {
            ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#f43f5e";
            ctx.font = "22px Courier New";
            ctx.textAlign = "center";
            ctx.fillText("💀 ZOMBII TE-AU PRINS! 💀", canvas.width / 2, canvas.height / 2 - 15);
            ctx.font = "14px Courier New";
            ctx.fillStyle = "#ffffff";
            ctx.fillText("Apasă Click sau Space ca să reîncerci", canvas.width / 2, canvas.height / 2 + 20);
            ctx.textAlign = "left";
        }

        // Ecran de Câștig (Victorie)
        if (gameWon) {
            ctx.fillStyle = "rgba(15, 23, 42, 0.95)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#34d399";
            ctx.font = "18px Courier New";
            ctx.textAlign = "center";
            ctx.fillText("🌟 BAZA LEGO A SUPRAVIEȚUIT! 🌟", canvas.width / 2, canvas.height / 2 - 50);
            
            ctx.fillStyle = "#ffffff";
            ctx.font = "13px Courier New";
            ctx.fillText("Cadoul tău (Raspberry Pi 5) este la iubita ta!", canvas.width / 2, canvas.height / 2 - 15);
            ctx.fillText("1. Codul 'I love you': apasă de 3 ori 👆✨", canvas.width / 2, canvas.height / 2 + 15);
            ctx.fillText("2. Primești un pupic cald de la ea! 😘", canvas.width / 2, canvas.height / 2 + 45);
            ctx.textAlign = "left";
        }

        requestAnimationFrame(update);
    }

    // Pornire animație
    update();
</script>

</body>
</html>
